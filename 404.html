<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Furnish Creations</title>
  <link rel="icon" type="image/png" href="/Assets/SvgjsG3205.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Self-contained so this page still renders correctly even if styles.css is the
       thing that failed to load. */
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: #f9f8f0;
      color: #153229;
      font-family: "CabinetGrotesk-Regular", system-ui, sans-serif;
    }

    .nf-wrap img {
      width: 190px;
      max-width: 60%;
      margin-bottom: 2.5rem;
    }

    .nf-code {
      font-family: "CabinetGrotesk-Black", system-ui, sans-serif;
      font-size: clamp(3.5rem, 14vw, 6rem);
      line-height: 1;
      color: #255849;
      margin: 0;
    }

    .nf-wrap h1 {
      font-family: "CabinetGrotesk-Bold", system-ui, sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      margin: 1rem 0 0.5rem;
    }

    .nf-wrap p {
      max-width: 34rem;
      margin: 0 0 2rem;
      line-height: 1.6;
      opacity: 0.8;
    }

    .nf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .nf-btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      font-family: "CabinetGrotesk-Medium", system-ui, sans-serif;
      background: #255849;
      color: #f9f8f0;
      transition: background 0.2s ease;
    }

    .nf-btn:hover {
      background: #153229;
    }

    .nf-btn.secondary {
      background: transparent;
      color: #255849;
      box-shadow: inset 0 0 0 2px #255849;
    }

    .nf-btn.secondary:hover {
      background: #255849;
      color: #f9f8f0;
    }
  </style>
</head>

<body>
  <main class="nf-wrap">
    <img src="/Assets/Logo Dark.png" alt="Furnish Creations">
    <p class="nf-code">404</p>
    <h1>We couldn't find that page</h1>
    <p>
      The link may be out of date, or the page may have moved. Everything we make —
      sofas, recliners, beds and upholstery — is still just one click away.
    </p>
    <div class="nf-actions">
      <a class="nf-btn" href="/">Back to home</a>
      <a class="nf-btn secondary" href="https://wa.me/918700322846?text=Hi" target="_blank" rel="noopener">
        Chat on WhatsApp
      </a>
    </div>
  </main>
</body>

</html>
