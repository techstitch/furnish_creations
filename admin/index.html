<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Furnish Creations — Website Editor</title>
  <link rel="icon" type="image/png" href="../Assets/SvgjsG3205.png">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>
  <div id="toasts" class="toasts"></div>

  <!-- Login -->
  <div id="loginView" class="login-view" hidden>
    <div class="login-card">
      <div class="login-brand">
        <img src="../Assets/Logo Dark.png" alt="Furnish Creations">
      </div>
      <h1>Website Editor</h1>
      <p class="login-sub">Sign in to update your website.</p>
      <form id="loginForm" autocomplete="on">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="username">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" required autocomplete="current-password">
        <p id="loginError" class="alert alert-error" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../Assets/Group 1 (2).png" alt="Furnish Creations">
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <p id="userEmail" class="user-email"></p>
        <div class="btn-row">
          <a class="btn btn-sm btn-ghost" href="../index.html" target="_blank" rel="noopener">View site</a>
          <button id="signOutBtn" class="btn btn-sm btn-ghost" type="button">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <button id="navToggle" class="nav-toggle" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div id="bannerHost"></div>
      <div id="panel" class="panel"></div>
    </main>
    <div class="nav-scrim"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
